name: Build installer

# Pushes to main run tests, build the widget and installer, auto-compute the
# next vX.Y.Z version (patch bump from the latest v* tag, or SpotDock.csproj
# <Version> if higher / no tags exist), and publish a GitHub Release with
# SpotDock-Setup.exe and SpotDock.exe. Pull requests and workflow_dispatch
# build, test, and upload workflow artifacts without publishing a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    # Windows only: Win32 / Direct2D / WinRT NativeAOT build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/SpotDock/SpotDock.csproj
          $csprojRaw = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          $parsedCsproj = [version]$csprojRaw
          $csprojVer = [version]::new($parsedCsproj.Major, $parsedCsproj.Minor, [Math]::Max($parsedCsproj.Build, 0))

          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            $tagVersions = @(git tag -l "v*") | ForEach-Object {
              $v = $null
              if ([version]::TryParse($_.Trim().TrimStart('v', 'V'), [ref]$v)) {
                [version]::new($v.Major, $v.Minor, [Math]::Max($v.Build, 0))
              }
            }
            $latestTag = $tagVersions | Sort-Object -Descending | Select-Object -First 1
            if ($null -eq $latestTag -or $csprojVer -gt $latestTag) {
              $nextVer = $csprojVer
            } else {
              $nextVer = [version]::new($latestTag.Major, $latestTag.Minor, $latestTag.Build + 1)
            }
          } else {
            $nextVer = $csprojVer
          }

          $version = "$($nextVer.Major).$($nextVer.Minor).$($nextVer.Build)"
          $tag = "v$version"

          $manifest = Get-Content src/spotdock-bridge/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            $prevManifestVersion = $manifest.version
            $manifest.version = $version
            $manifest | ConvertTo-Json -Depth 10 | Set-Content src/spotdock-bridge/manifest.json -Encoding utf8
            Write-Host "Synced src/spotdock-bridge/manifest.json version from $prevManifestVersion to $version for packaging."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version (tag: $tag)"

      - name: Run unit tests
        run: dotnet test tests/SpotDock.Tests/SpotDock.Tests.csproj -c Release

      - name: Build widget
        run: dotnet publish src/SpotDock/SpotDock.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts/publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        # The parentheses are required: PowerShell reads $env:ProgramFiles(x86)
        # as the variable ProgramFiles followed by the text "(x86)"
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} build/setup.iss'

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/installer/*.exe

      # Separately - the bare exe: handy for updating an already installed
      # widget without running the installer (also used by UpdateService)
      - uses: actions/upload-artifact@v7
        with:
          name: widget-exe
          path: artifacts/publish/SpotDock.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/installer/*.exe
            artifacts/publish/SpotDock.exe
          generate_release_notes: true
