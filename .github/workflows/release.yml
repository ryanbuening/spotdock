name: Build installer

# A tag like v2.0.0 builds the installer and bare exe and attaches both to the
# GitHub release. Pushes to main and pull requests build and run unit tests so
# breakages show up immediately.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows only: Win32 / Direct2D / WinRT NativeAOT build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content SpotDock.csproj
          $csprojVer = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref }}".Substring("refs/tags/v".Length)
          } else {
            $version = $csprojVer
          }
          $manifest = Get-Content spotdock-bridge/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            Write-Host "::warning::spotdock-bridge/manifest.json version ($($manifest.version)) differs from build version ($version); syncing for packaging."
            $manifest.version = $version
            $manifest | ConvertTo-Json -Depth 10 | Set-Content spotdock-bridge/manifest.json -Encoding utf8
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version"

      - name: Run unit tests
        run: dotnet test SpotDock.Tests/SpotDock.Tests.csproj -c Release

      - name: Build widget
        run: dotnet publish SpotDock.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        # The parentheses are required: PowerShell reads $env:ProgramFiles(x86)
        # as the variable ProgramFiles followed by the text "(x86)"
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} setup.iss'

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/*.exe

      # Separately - the bare exe: handy for updating an already installed
      # widget without running the installer (also used by UpdateService)
      - uses: actions/upload-artifact@v7
        with:
          name: widget-exe
          path: publish/SpotDock.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/*.exe
            publish/SpotDock.exe
          generate_release_notes: true
